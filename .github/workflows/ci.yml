name: CI - Lint, Type Check, Test & Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20" # matches the Dockerfile base image
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      # Node's built-in runner via tsx; the suites are pure (no DB / env needed).
      - name: Unit Tests
        run: npm run test:all

  # Schema migrations are hand-written SQL in prisma/sql/ and applied by hand
  # (psql), so nothing else guarantees the live database still matches
  # prisma/schema.prisma. This job introspects a database (read-only) and fails
  # if the schema on disk and the schema in the DB have drifted apart.
  #
  # Repository secrets:
  #   DRIFT_CHECK_DATABASE_URL          the main database (use a read-only role)
  #   CAREERS_DRIFT_CHECK_DATABASE_URL  optional; the careers database
  # Skipped with a warning when the secret is missing (fork PRs cannot see
  # secrets, so it also skips there).
  schema-drift:
    name: Schema Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Diff live database against prisma/schema.prisma
        env:
          DRIFT_CHECK_DATABASE_URL: ${{ secrets.DRIFT_CHECK_DATABASE_URL }}
        run: |
          if [ -z "$DRIFT_CHECK_DATABASE_URL" ]; then
            echo "::warning::DRIFT_CHECK_DATABASE_URL secret not set - skipping schema drift check"
            exit 0
          fi
          # --exit-code: 0 = in sync, 2 = drift; --script prints the SQL that would reconcile it.
          npx prisma migrate diff \
            --from-url "$DRIFT_CHECK_DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --script --exit-code

      - name: Diff careers database against prisma/careers/schema.prisma
        env:
          CAREERS_DRIFT_CHECK_DATABASE_URL: ${{ secrets.CAREERS_DRIFT_CHECK_DATABASE_URL }}
        run: |
          if [ -z "$CAREERS_DRIFT_CHECK_DATABASE_URL" ]; then
            echo "::notice::CAREERS_DRIFT_CHECK_DATABASE_URL secret not set - skipping careers drift check"
            exit 0
          fi
          npx prisma migrate diff \
            --from-url "$CAREERS_DRIFT_CHECK_DATABASE_URL" \
            --to-schema-datamodel prisma/careers/schema.prisma \
            --script --exit-code

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Restore Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.[jt]s', '**/*.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Set build environment variables
        shell: bash
        run: |
          # Clerk keys — required. Get test keys from: https://dashboard.clerk.com/last-active?path=api-keys
          if [ -z "${{ secrets.CI_CLERK_PUBLISHABLE_KEY }}" ]; then
            echo "Error: CI_CLERK_PUBLISHABLE_KEY secret is required for build."
            echo "Please set it in GitHub Settings > Secrets and variables > Actions"
            echo "Get a test key from: https://dashboard.clerk.com/last-active?path=api-keys"
            exit 1
          else
            echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ secrets.CI_CLERK_PUBLISHABLE_KEY }}" >> $GITHUB_ENV
          fi

          if [ -z "${{ secrets.CI_CLERK_SECRET_KEY }}" ]; then
            echo "Error: CI_CLERK_SECRET_KEY secret is required for build."
            echo "Please set it in GitHub Settings > Secrets and variables > Actions"
            exit 1
          else
            echo "CLERK_SECRET_KEY=${{ secrets.CI_CLERK_SECRET_KEY }}" >> $GITHUB_ENV
          fi

          if [ -z "${{ secrets.CI_DATABASE_URL }}" ]; then
            echo "DATABASE_URL=postgresql://ci_user:ci_password@localhost:5432/ci_database?sslmode=disable" >> $GITHUB_ENV
          else
            echo "DATABASE_URL=${{ secrets.CI_DATABASE_URL }}" >> $GITHUB_ENV
          fi

          if [ -z "${{ secrets.CI_GOOGLE_MAPS_API_KEY }}" ]; then
            echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=CI_PLACEHOLDER_GOOGLE_MAPS_KEY" >> $GITHUB_ENV
          else
            echo "NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ secrets.CI_GOOGLE_MAPS_API_KEY }}" >> $GITHUB_ENV
          fi

          # Admin passkey — safe placeholder for CI
          echo "NEXT_PUBLIC_ADMIN_PASSKEY=0000" >> $GITHUB_ENV

      - name: Build Project
        run: npm run build
