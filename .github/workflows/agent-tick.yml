# External scheduler for the agent system.
#
# Vercel Hobby only allows daily crons, so vercel.json keeps a daily safety net
# and this workflow does the real cadence: every 5 minutes it hits
# /api/cron/agent-tick (no-shows, transport outcomes, response-window timeouts /
# escalation, stale-alert closure) and every 30 minutes /api/cron/monitor-inventory.
#
# Required repository secrets:
#   APP_URL      e.g. https://haemologix.in   (no trailing slash)
#   CRON_SECRET  same value as the CRON_SECRET env var on Vercel
#
# Note: GitHub schedules are best-effort (can lag 5–15 min at busy times); if you
# later host the model service on a VM/container, a curl loop there is more precise.
name: agent-tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: agent-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: agent-tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          code=$(curl -sS -m 90 -o /tmp/tick.json -w "%{http_code}" \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/cron/agent-tick")
          echo "agent-tick → $code"; cat /tmp/tick.json; echo
          test "$code" = "200"

      # monitor-inventory every 30 min (only on ticks whose minute is 00 or 30)
      - name: monitor-inventory
        if: ${{ always() }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          m=$(date -u +%M)
          if [ "$m" -ge 5 ] && [ "$m" -lt 30 ] || [ "$m" -ge 35 ]; then echo "skip ($m)"; exit 0; fi
          code=$(curl -sS -m 90 -o /tmp/mon.json -w "%{http_code}" \
            -H "x-cron-secret: $CRON_SECRET" "$APP_URL/api/cron/monitor-inventory")
          echo "monitor-inventory → $code"; cat /tmp/mon.json; echo
          test "$code" = "200"
